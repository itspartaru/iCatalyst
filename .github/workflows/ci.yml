name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Набор тестов целиком проходит без единого установленного оптимизатора:
  # поддельные инструменты в tests/fakebin подставляются через
  # ICATALYST_TOOLS_DIR. Поэтому эта работа быстрая и не зависит от репозиториев
  # пакетов.
  test:
    name: тесты (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Проверить, что всё компилируется
        run: python -m compileall -q icatalyst tests
      - name: Прогнать тесты
        run: python -m unittest discover -s tests -t . -v

  # Настоящие инструменты: только здесь выясняются реальные написания флагов
  # установленных версий. Тесты в test_real_tools.py пропускаются, если
  # инструмент отсутствует, поэтому эта работа — единственное место, где они
  # действительно исполняются на Linux.
  real-tools-linux:
    name: настоящие инструменты (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Установить оптимизаторы из пакетов
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            optipng zopfli advancecomp gifsicle libjpeg-turbo-progs
      # Без этого шага oxipng отсутствует, тест его флагов молча пропускается, а
      # проверка «ни один тест не пропущен» ниже как раз для этого и стоит.
      - name: Скачать oxipng
        run: python3 Tools/build_tools.py --download
      - name: Показать найденные инструменты и команды
        run: python -m icatalyst --doctor
      - name: Прогнать тесты с настоящими инструментами
        run: |
          python -m unittest tests.test_real_tools -v 2>&1 | tee result.log
          if grep -q "skipped" result.log; then
            echo "::error::часть проверок пропущена — инструмент не найден"
            exit 1
          fi

  # Настоящая Windows-цепочка исполняется здесь и только здесь: вложенные
  # Tools/apps/*.exe лежат в git именно для этого.
  real-tools-windows:
    name: настоящие инструменты (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Скачать oxipng
        run: python Tools/build_tools.py --download
      - name: Показать найденные инструменты и команды
        run: python -m icatalyst --doctor
      - name: Прогнать тесты с настоящими инструментами
        run: python -m unittest tests.test_real_tools -v

  # Пакет собирается на каждый push: он ломается тихо, если про него не помнить,
  # а lintian ловит нарушения политики Debian раньше пользователей.
  deb:
    name: сборка .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Установить средства проверки пакета
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian desktop-file-utils
      - name: Собрать и проверить пакет
        run: python3 packaging/build_deb.py --lintian
      - name: Установить и запустить
        run: |
          sudo apt-get install -y ./dist/icatalyst_*_all.deb
          icatalyst --version
          icatalyst --doctor
          desktop-file-validate /usr/share/applications/icatalyst.desktop

  # Живое сравнение с версией 2.7 запускается ТОЛЬКО вручную. В свежих образах
  # windows-раннера цепочка 2010 года не работает: `wmic` удалён, а прогон встаёт
  # на `cscript //E:JScript filter.js`. Держать CI и релизы заложником этого
  # неправильно, поэтому в обычном прогоне сравнение идёт с записанным эталоном
  # (tests/parity_baseline.json), а живой запуск остаётся инструментом для
  # машины, где 2.7 работает: там он и осмыслен.
  #
  # Запись эталона: ICATALYST_PARITY=record python -m unittest tests.test_parity
  parity-windows:
    name: живое сравнение с 2.7 (вручную)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # Страховка: код 2010 года содержит циклы ожидания без выхода.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Сравнить старую и новую реализации
        env:
          ICATALYST_PARITY: run
        shell: bash
        run: |
          python -m unittest tests.test_parity -v 2>&1 | tee parity.log
          if grep -q "LiveParityTest.*skipped" parity.log; then
            echo "::error::живое сравнение пропущено — цепочка 2.7 недоступна"
            exit 1
          fi
